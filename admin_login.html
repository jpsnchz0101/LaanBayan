<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaanBayan — Admin Login</title>
<meta name="description" content="Barangay staff access only for LaanBayan administration.">
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin_login.css">
</head>
<body>

<div class="admin-login-page">

  <div class="admin-login-card">

    <!-- Brand header matching navbar logo -->
    <div class="admin-card-brand">
      <svg class="admin-logo-icon" width="22" height="21" viewBox="0 0 64 61" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M29.1334 53.5656V33.3937C26.5045 33.309 23.9976 32.7631 21.6128 31.7562C19.2283 30.7493 17.0959 29.3497 15.2154 27.5574C13.2492 25.6833 11.7483 23.5195 10.7128 21.066C9.6772 18.6128 9.15942 16.0714 9.15942 13.4416V8.80306H14.0261C16.7612 8.80306 19.4094 9.31224 21.9708 10.3306C24.5325 11.349 26.7901 12.7933 28.7434 14.6635C29.9608 15.8238 31.0163 17.1395 31.9101 18.6107C32.8043 20.0819 33.4668 21.6126 33.8974 23.2029C34.0743 22.8873 34.2732 22.5916 34.4941 22.3158C34.715 22.0401 34.947 21.7865 35.1901 21.5552C37.1536 19.685 39.423 18.2407 41.9981 17.2223C44.5728 16.204 47.2401 15.6948 50.0001 15.6948H54.8668V20.3333C54.8668 22.9839 54.3332 25.5308 53.2661 27.9742C52.199 30.4176 50.6819 32.577 48.7148 34.4523C46.8365 36.2425 44.7163 37.6304 42.3541 38.6162C39.9914 39.6019 37.4956 40.1372 34.8668 40.2219V53.5656H29.1334ZM29.2261 27.8656C29.2261 26.3829 28.8261 24.7944 28.0261 23.0999C27.2261 21.4055 26.115 19.8805 24.6928 18.5249C23.4039 17.2965 21.9039 16.3116 20.1928 15.5702C18.4816 14.8289 16.715 14.3947 14.8928 14.2676C14.9816 16.0468 15.4039 17.7413 16.1594 19.351C16.915 20.9607 17.9594 22.401 19.2928 23.6718C20.6261 24.9426 22.1483 25.9381 23.8594 26.6583C25.5705 27.3784 27.3594 27.7808 29.2261 27.8656ZM34.8668 34.7573C36.4223 34.7573 38.089 34.3972 39.8668 33.6771C41.6445 32.9569 43.2445 31.9191 44.6668 30.5635C46.0001 29.2927 47.0556 27.8524 47.8334 26.2427C48.6112 24.633 49.0445 22.9385 49.1334 21.1594C47.2668 21.2441 45.489 21.6571 43.8001 22.3984C42.1112 23.1398 40.6001 24.1458 39.2668 25.4167C37.9334 26.6875 36.889 28.1172 36.1334 29.7057C35.3779 31.2943 34.9556 32.9781 34.8668 34.7573Z" fill="#244b31"/>
      </svg>
      <span class="admin-brand-wordmark"><span class="laan">Laan</span><span class="bayan">Bayan</span></span>
    </div>

    <h1 class="admin-card-title">Admin Login</h1>
    <p class="admin-card-subtitle">Barangay staff access only.</p>

    <!-- Error alert shown when credentials fail -->
    <div class="admin-login-error" id="adminLoginError" role="alert" style="display: none;"></div>

    <form id="adminLoginForm" novalidate>
      <div class="admin-field-group">
        <label for="adminUsername" class="admin-field-label">Admin ID</label>
        <input
          id="adminUsername"
          name="adminUsername"
          type="text"
          class="admin-field-input"
          placeholder=""
          required
          autocomplete="username"
          value="admin"
        >
      </div>

      <div class="admin-field-group">
        <label for="adminPassword" class="admin-field-label">Password</label>
        <input
          id="adminPassword"
          name="adminPassword"
          type="password"
          class="admin-field-input"
          placeholder=""
          required
          autocomplete="current-password"
          value="admin123"
        >
      </div>

      <button type="submit" class="btn-admin-login-action" id="btnAdminLoginSubmit">
        Login
      </button>

      <div class="admin-login-bottom">
        <a href="index.html" class="link-resident-login">Resident login</a>
      </div>
    </form>

  </div>

</div>

<script src="js/script.js"></script>
</body>
</html>
